<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Veritas Wealth</title>
    <meta name="description" content="Global private offshore wealth management for individuals, families and institutions with international financial interests." />
    <meta property="og:title" content="Veritas Wealth" />
    <meta property="og:description" content="A private wealth-management approach for individuals, families and institutions with international financial interests." />
    <meta property="og:image" content="/assets/IMG_3476_1766680873153.jpeg" />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/veritas-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#244e3b" />
    <link rel="stylesheet" href="/branded-loader.css" />
    <link rel="preload" as="image" href="/veritas-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <main class="vw-loader" data-testid="branded-loader" data-startup-loader>
        <div class="vw-loader-content">
          <img class="vw-loader-logo" src="/veritas-logo.png" alt="" aria-hidden="true" width="128" height="128" />
          <div class="vw-loader-line" aria-hidden="true"></div>
          <p class="vw-loader-status" role="status" aria-live="polite">Loading</p>
          <button class="vw-loader-retry" data-startup-retry hidden type="button">Reload site</button>
        </div>
      </main>
    </div>
    <noscript>
      <style>[data-startup-loader] { display: none; }</style>
      <p>Please enable JavaScript to use Veritas Wealth.</p>
    </noscript>
    <script>
      // A bundle that cannot load must leave a way to retry, not a perpetual splash.
      window.addEventListener("error", function (event) {
        var loader = document.querySelector("[data-startup-loader]");
        if (!loader || !(event.target instanceof HTMLScriptElement || event instanceof ErrorEvent)) return;
        loader.classList.add("vw-loader-failed");
        loader.querySelector(".vw-loader-line").hidden = true;
        loader.querySelector("[role=status]").textContent = "We couldn't load the site.";
        var retry = loader.querySelector("[data-startup-retry]");
        retry.hidden = false;
        retry.onclick = function () { window.location.reload(); };
      }, true);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
